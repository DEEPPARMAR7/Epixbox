name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify Node runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Build API image
        run: docker build -f Dockerfile.server -t epixbox-api:ci .

      - name: Build client image
        run: docker build -f Dockerfile.client -t epixbox-client:ci .

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict \
            -ignore-missing-schemas \
            k8s/namespace.yaml \
            k8s/configmap.yaml \
            k8s/api-deployment.yaml \
            k8s/api-service.yaml \
            k8s/client-deployment.yaml \
            k8s/client-service.yaml

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform validate
