apiVersion: apps/v1
kind: Deployment
metadata:
  name: epixbox-client
  namespace: epixbox
  labels:
    app.kubernetes.io/name: epixbox-client
    app.kubernetes.io/component: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epixbox-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epixbox-client
        app.kubernetes.io/component: client
    spec:
      containers:
        - name: client
          image: epic-client:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
