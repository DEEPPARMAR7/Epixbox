apiVersion: v1
kind: ConfigMap
metadata:
  name: epixbox-config
  namespace: epixbox
data:
  NODE_ENV: production
  NODE_OPTIONS: --dns-result-order=ipv4first
  PORT: "4000"
  AUTO_MIGRATE: "false"
  ALLOW_PENDING_MIGRATIONS: "true"
  CLIENT_URL: http://localhost
  FRONTEND_URL: http://localhost
  CORS_ORIGINS: http://localhost
