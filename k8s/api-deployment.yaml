apiVersion: apps/v1
kind: Deployment
metadata:
  name: epixbox-api
  namespace: epixbox
  labels:
    app.kubernetes.io/name: epixbox-api
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: epixbox-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: epixbox-api
        app.kubernetes.io/component: api
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: api
          image: epic-api:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: epixbox-config
            - secretRef:
                name: epixbox-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
